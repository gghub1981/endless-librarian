  </defs>
  <rect x="34" y="250" width="30" height="110" rx="8" fill="#555c63"/>
  <rect x="876" y="630" width="30" height="110" rx="8" fill="#555c63"/>
  <rect x="876" y="850" width="30" height="110" rx="8" fill="#555c63"/>
  <rect x="34" y="850" width="30" height="110" rx="8" fill="#555c63"/>
  <rect x="60" y="20" width="820" height="1300" rx="64" fill="url(#body)" stroke="#c4c9ce" stroke-width="3"/>
  <rect x="100" y="168" width="740" height="720" rx="22" fill="#eceef0" stroke="#cfd4d8" stroke-width="3"/>
  <circle cx="160" cy="96" r="26" fill="#8a929b"/>
  <circle cx="722" cy="90" r="11" fill="#fff" stroke="#c4c9ce" stroke-width="2"/>
