    </linearGradient>
    <radialGradient id="knob" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3d7db"/>
    </radialGradient>
    <radialGradient id="foot" cx=".45" cy=".4" r=".6">
      <stop offset="0" stop-color="#e9ebed"/><stop offset="1" stop-color="#9aa1a8"/>
